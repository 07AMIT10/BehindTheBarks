# Shared config. Person B owns this file; Person A's data section is below.
# Person B: merge your sections (LLM, notify, demo_mode, cooldowns) alongside, don't replace.

data:
  source:
    type: file            # webcam | stream | file
    path: null            # video path (file) or URL (stream)
    device: 0             # webcam device index
    audio: null           # optional audio override path (file mode) or null for mic/embedded track
    loop: false
  fps: 8
  keypoint_conf_threshold: 0.3
  # Feeding zone polygon in normalised (0..1) image coords, clockwise from top-left.
  feeding_zone:
    - [0.2, 0.4]
    - [0.8, 0.4]
    - [0.8, 0.95]
    - [0.2, 0.95]
  detect:
    model: models/yolo11s.pt   # COCO-pretrained; auto-downloaded once, then offline
    conf: 0.25
    imgsz: 640
    ema_alpha: 0.5             # weight of the newest bbox (1.0 = no smoothing)
    ema_reset_misses: 8        # frames without a dog before smoothing restarts
    crop_pad: 0.15             # crop padding per side, fraction of bbox size
    zone_anchor: bottom_center # bottom_center | center: bbox point tested against feeding_zone
  pose:
    superanimal: superanimal_quadruped   # DeepLabCut model zoo dataset name
    model: hrnet_w32                     # weights auto-download once into the deeplabcut package, then offline
    device: auto                         # auto (MPS if available, else CPU) | mps | cpu
    crop_pad: 0.15                       # padding around the dog bbox before pose, fraction per side
  face:
    model: models/dog_face_landmarks_full.tflite   # DogFLW 46-point model; run scripts/fetch_face_model.py once (CC BY-NC 4.0)
    threads: 6                # TFLite CPU threads (M2: 1=263 ms, 2=135, 4=71, 6=62, 8=60)
    crop_pad: 0.25            # head-keypoint box padded by this fraction per side, then squared
    min_crop_px: 48           # smaller head crops return None (too small to read a mouth)
    min_head_points: 3        # head keypoints needed, one of them an eye or ear base
    min_inside_frac: 0.9      # plausibility: fraction of landmarks that must fall inside the crop
    min_spread: 0.25          # plausibility: landmark extent as a fraction of the crop side
  features:                   # FrameEvent feature extraction (Step 6); every key is optional, defaults live in features.py
    window_s: 3.0             # rolling keypoint window
    gap_reset_s: 2.0          # no dog for this long empties the window
    tail_height_scale: 0.4    # tail-tip offset from the back line, in body lengths, that maps to +-1
    wag_min_std: 0.03         # tail oscillation (body lengths, std) below which the tail counts as still
    wag_min_peak_ratio: 0.3   # share of spectral power at the peak below which the wag is "not periodic"
    ear_up_min: 0.6           # ear vector upward cosine for "up"
    ear_back_cos: 0.85        # cosine to the backward head axis for "back"
    mouth_closed: 0.03        # lip gap / face size that reads as 0
    mouth_full: 0.25          # lip gap / face size that reads as 1
    baseline_s: 30.0          # history used for the standing-height baseline
    lowering_deadband: 0.05   # fractional height drop ignored as noise
    lowering_full: 0.4        # fractional height drop that reads as 1
    motion_floor: 0.2         # keypoint speed (body lengths/s) that reads as 0 (pose jitter; provisional, tune in Step 11)
    motion_full: 1.0          # keypoint speed (body lengths/s) that reads as 1
    smooth:                   # EMA weight of the newest value per feature (1.0 = no smoothing)
      tail_height: 0.4
      mouth_open: 0.5
      body_lowering: 0.4
      motion_energy: 0.5
  audio:                     # YAMNet AudioEvents (Step 7)
    model_dir: models/yamnet   # TF Hub saved model; fetched once on first use (needs network once), then offline
    hop_s: 0.48                # window hop (window is 0.96 s, so 50% overlap)
    threshold: 0.3             # best mapped-class score below this -> "other"
    silence_rms: 0.005         # window RMS below this -> "silence" (model is skipped)
    debounce_s: 1.0            # min gap between events with the same dog label; 0 = one event per window
    max_gap_s: 0.5             # a timestamp gap larger than this (dropped mic chunks) restarts the window buffer
    label_map:                 # our label -> AudioSet display names; score = max over the listed classes
      bark: [Bark, Bow-wow]
      yip: [Yip]
      growl: [Growling]
      whimper: [Whimper (dog)]
      howl: [Howl]
  # Rules thresholds; tuned in Step 11.
  rules:
    window_s: 3.0
    hysteresis_s: 1.5
    no_dog_unknown_s: 2.0
    disinterested_s: 8.0
    aggressive_max_conf_without_growl: 0.5
    thresholds:
      tail_high: 0.3
      tail_low: -0.3
      wag_fast_hz: 3.0
      motion_high: 0.6
      motion_low: 0.15
      body_lowering_high: 0.5
      mouth_open: 0.4
