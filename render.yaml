services:
  - type: web
    name: behind-the-barks
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements-web.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: WEB_PIPELINE
        value: remote
      - key: BTB_DASHBOARD_PIN
        value: "1234"
      - key: PYTHON_VERSION
        value: "3.12.3"
