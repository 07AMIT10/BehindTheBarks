name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Python Backend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements-web.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-web.txt

      - name: Run Web Backend Pytest Suite
        run: |
          PYTHONPATH=. pytest tests/web

  frontend-tests:
    name: Next.js Frontend Tests & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Vitest Suite
        run: npm test -- --run

      - name: Run ESLint
        run: npm run lint

      - name: Run Typecheck
        run: npm run typecheck

      - name: Build Next.js Production Bundle
        run: npm run build

  android-build:
    name: Android On-Device App Build & Verify
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Android Unit Tests
        run: ./gradlew testDebugUnitTest

      # The release keystore is a secret, never committed. Without BTB_KEYSTORE_B64 the release steps
      # are skipped (visibly) rather than signed with the debug key; the app's Gradle file refuses that.
      - name: Decode release keystore (only when the secret is set)
        env:
          BTB_KEYSTORE_B64: ${{ secrets.BTB_KEYSTORE_B64 }}
        run: |
          if [ -n "$BTB_KEYSTORE_B64" ]; then
            echo "$BTB_KEYSTORE_B64" | base64 --decode > android/release.jks
            echo "release keystore decoded"
          else
            echo "::notice::BTB_KEYSTORE_B64 is not set: release APK/AAB steps are skipped"
          fi

      - name: Build Production APK & App Bundle (AAB)
        if: hashFiles('android/release.jks') != ''
        env:
          BTB_KEYSTORE_PASSWORD: ${{ secrets.BTB_KEYSTORE_PASSWORD }}
          BTB_KEY_ALIAS: ${{ secrets.BTB_KEY_ALIAS }}
          BTB_KEY_PASSWORD: ${{ secrets.BTB_KEY_PASSWORD }}
        run: ./gradlew assembleRelease bundleRelease

      - name: Verify 16KB Page Alignment on Release APK
        if: hashFiles('android/release.jks') != ''
        run: |
          BUILD_TOOLS_ZIPALIGN=$(find $ANDROID_HOME/build-tools/ -name zipalign | sort -V | tail -n 1)
          echo "Using zipalign at $BUILD_TOOLS_ZIPALIGN"
          $BUILD_TOOLS_ZIPALIGN -c -P 16 4 app/build/outputs/apk/release/app-release.apk

      - name: Upload Release APK
        if: hashFiles('android/release.jks') != ''
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk

      - name: Upload Release AAB (Play Store)
        if: hashFiles('android/release.jks') != ''
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
